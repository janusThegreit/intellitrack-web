      - "8001:8001"
    environment:
      APP_NAME: "IntelliTrack Auth Service"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001

      DB_CONNECTION: pgsql
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_DATABASE: intellitrack_auth_db
      DB_USERNAME: intellitrack_user
      DB_PASSWORD: intellitrack_password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Session / Cache
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default

      MICROSERVICE_INTERNAL_SECRET: intellitrack-secret-token-prod

    depends_on:
      - postgres-auth
      - redis

    networks:
      - intellitrack-net


