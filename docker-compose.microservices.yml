  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: intellitrack-redis-broker
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - intellitrack-net


  # ============================================================
  # AUTH DATABASE
  # ============================================================
  postgres-auth:
    image: postgres:16-alpine
    container_name: intellitrack-web-postgres-auth-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellitrack_auth_db
      POSTGRES_USER: intellitrack_user
      POSTGRES_PASSWORD: intellitrack_password
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - intellitrack-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U intellitrack_user -d intellitrack_auth_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


