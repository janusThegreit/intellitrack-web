networks:
  intellitrack-net:
    driver: bridge


volumes:
  postgres_auth_data:
  postgres_customer_data:
  postgres_inventory_data:
  postgres_quotation_data:
  postgres_rental_data:
  postgres_project_data:
  postgres_notification_data:
  postgres_analytics_data: