services:

  # ============================================================
  # API GATEWAY
  # ============================================================
  gateway:
    build:
      context: .
      dockerfile: services/docker/Dockerfile.service
    container_name: intellitrack-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "IntelliTrack API Gateway"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      # Internal Microservice URLs
      AUTH_SERVICE_URL: http://auth-service:8001
      CUSTOMER_SERVICE_URL: http://customer-service:8002
      INVENTORY_SERVICE_URL: http://inventory-service:8003
      QUOTATION_SERVICE_URL: http://quotation-service:8004
      RENTAL_SERVICE_URL: http://rental-service:8005
      PROJECT_SERVICE_URL: http://project-service:8006
      NOTIFICATION_SERVICE_URL: http://notification-service:8007
      ANALYTICS_SERVICE_URL: http://analytics-service:8008

      # Internal Service Authentication
      MICROSERVICE_INTERNAL_SECRET: intellitrack-secret-token-prod

      # Gateway Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Gateway Session / Cache
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      CACHE_STORE: redis

      # Gateway Authentication Database
      # The current AuthController directly queries the User model,
      # so the gateway needs access to the Auth Service database.
      DB_CONNECTION: pgsql
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_DATABASE: intellitrack_auth_db
      DB_USERNAME: intellitrack_user
      DB_PASSWORD: intellitrack_password

    depends_on:
      - redis
      - postgres-auth
      - auth-service
      - customer-service
      - inventory-service
      - quotation-service
      - rental-service
      - project-service
      - notification-service
      - analytics-service

    networks:
      - intellitrack-net


  # ============================================================
  # AUTH SERVICE
  # ============================================================
  auth-service:
