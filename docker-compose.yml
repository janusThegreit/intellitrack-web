services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: intellitrack_db
      DB_USERNAME: intellitrack_web
      DB_PASSWORD: intellitrack_password
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellitrack_db
      POSTGRES_USER: intellitrack_web
      POSTGRES_PASSWORD: intellitrack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellitrack_web -d intellitrack_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  app_storage:
